name: Feature request
description: Suggest an enhancement for this sandbox project
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.
        Please describe the idea and why it helps experimentation in this repository.

  - type: input
    id: problem
    attributes:
      label: Problem statement
      description: What limitation are you trying to solve?
      placeholder: Hard to compare strategy order impacts without a deterministic runner
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you want
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional

  - type: textarea
    id: scope
    attributes:
      label: Scope and trade-offs
      description: Optional notes about complexity, risk, or compatibility
